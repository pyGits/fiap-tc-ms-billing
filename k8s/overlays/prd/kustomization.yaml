apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente de PRODUÇÃO — deploy automático a cada merge em `main`.
namespace: fiap-prd

resources:
  - namespace.yaml
  - ../../base

images:
  - name: fiap-tc-ms-billing
    newName: fiap-tc-ms-billing
    newTag: prd

patches:
  - path: patch-deployment.yaml

configMapGenerator:
  - name: ms-billing-config
    behavior: merge
    literals:
      - APP_ENV=prd
      - NEW_RELIC_APP_NAME=fiap-tc-ms-billing-prd
      - NEW_RELIC_LABELS=env:prd;project:fiap-tech-challenge;servico:ms-billing
      - LOG_LEVEL=info
      # Produção cobra de verdade: o provedor em memória fica desligado.
      - MERCADO_PAGO_MOCK=false

generatorOptions:
  disableNameSuffixHash: true
