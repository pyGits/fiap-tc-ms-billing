apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente de HOMOLOGAÇÃO — deploy automático a cada merge em `develop`.
namespace: fiap-hml

resources:
  - namespace.yaml
  - ../../base

images:
  # O pipeline substitui a tag pelo SHA do commit (kustomize edit set image).
  - name: fiap-tc-ms-billing
    newName: fiap-tc-ms-billing
    newTag: hml

patches:
  - path: patch-deployment.yaml
  - path: patch-hpa.yaml

configMapGenerator:
  - name: ms-billing-config
    behavior: merge
    literals:
      - APP_ENV=hml
      - NEW_RELIC_APP_NAME=fiap-tc-ms-billing-hml
      - NEW_RELIC_LABELS=env:hml;project:fiap-tech-challenge;servico:ms-billing
      - LOG_LEVEL=debug

generatorOptions:
  disableNameSuffixHash: true
