apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-billing-config
data:
  # Valores não sensíveis. Os sensíveis (MONGO_URI, RABBITMQ_URL, token do
  # Mercado Pago, licença do New Relic, IDs do Cognito) vêm do Secret
  # "ms-billing-secret", criado pelo pipeline a partir do AWS Systems Manager
  # Parameter Store.
  PORT: "3001"
  NODE_ENV: "production"
  SERVICE_NAME: "fiap-tc-ms-billing"
  MONGO_DB: "fiap_tc_billing"
  MONGO_TIMEOUT_MS: "5000"
  LOG_LEVEL: "info"
  AUTH_DISABLED: "false"
  RABBITMQ_PREFETCH: "10"
  LIMITE_LISTAGEM: "200"
  # Provedor de pagamento: com MERCADO_PAGO_MOCK=true o serviço usa o provedor
  # em memória. Em homologação ele fica ligado, porque cobrar de verdade a cada
  # teste de pipeline não é aceitável; em produção vem desligado pelo overlay.
  MERCADO_PAGO_MOCK: "true"
  MERCADO_PAGO_BASE_URL: "https://api.mercadopago.com"
  # Circuito abre após 3 falhas consecutivas do provedor externo.
  MERCADO_PAGO_LIMITE_FALHAS: "3"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
  NEW_RELIC_LOG: "stdout"
